<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="master.css">
</head>

<body>

    <!-- NAVBAR -->
    <div class="Navbar">
        <button id="darkModeToggle">🌙</button>
        <h2 class="logo">The Sign UP</h2>

        <div class="links">
            <a href="index.html">Home</a>
            <a href="Menu.html">Menu</a>
            <a href="About.html">About</a>
            <a href="Contact.html">Contact</a>
            <a href="SignIn.html">Sign In</a>
            <a href="SignUp.html">Sign Up</a>
        </div>
    </div>

    <!-- SIGN UP -->
    <section id="signup" class="auth">

        <div class="form-box">
            <h2>Create Account</h2>
            <p>Sign up to get started</p>

            <input type="text" id="newUser" placeholder="Username" required>
            <input type="email" id="newEmail" placeholder="Email" required>
            <input type="password" id="newPass" placeholder="Password" required>
            <input type="password" id="confirmPass" placeholder="Confirm Password" required>

            <button onclick="register()">Sign Up</button>

            <p id="msg2" style="color:green; display:none;">Account Created ✅</p>

            <p>Already have an account?
                <a href="SignIn.html">Sign In</a>
            </p>
        </div>

    </section>
    <script>
        function login() {

            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;

            if (user === "" || pass === "") {
                alert("Fill all fields ❗");
                return;
            }

            // Fake login
            if (user === "admin" && pass === "1234") {
                window.location.href = "index.html";
            } else {
                document.getElementById("msg").style.display = "block";
            }
        }
    </script>
    <script>
        const btn = document.getElementById("darkModeToggle");

        btn.onclick = function () {
            document.body.classList.toggle("dark");
        };
    </script>
    <script>
        function register() {

            let user = document.getElementById("newUser").value;
            let pass = document.getElementById("newPass").value;

            if (user === "" || pass === "") {
                alert("Fill all fields ❗");
                return;
            }

            // save in localStorage
            localStorage.setItem("username", user);
            localStorage.setItem("password", pass);

            document.getElementById("msg2").style.display = "block";

            setTimeout(() => {
                window.location.href = "SignIn.html";
            }, 2000);
        }
    </script>
</body>

</html>
